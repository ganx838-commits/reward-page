<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProVPN - Premium Access</title>
    <style>
        :root { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --green: #10B981; --blue: #3B82F6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: var(--card); padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: var(--blue); }
        .price { font-size: 32px; font-weight: bold; margin: 20px 0; color: var(--green); }
        .btn { background: var(--blue); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .qr-box { margin-top: 20px; display: none; }
        .qr-box img { width: 200px; height: 200px; border: 5px solid white; border-radius: 10px; }
        .address { word-break: break-all; font-size: 12px; color: #94A3B8; margin-top: 10px; }
        .copy-btn { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>PRO VPN 会员</h2>
    <div class="price">$1.00 USDT</div>
    
    <!-- 阶段1：点击支付 -->
    <button class="btn" id="payBtn" onclick="showQR()">立即支付</button>

    <!-- 阶段2：显示二维码和地址 -->
    <div class="qr-box" id="qrBox">
        <p>请使用 TronLink / Trust Wallet 扫描</p>
        <img id="qrImg" src="" alt="QR Code">
        <div class="address" id="addrText">TSzeymMiwsphqH28LyYD32xBMoihioBKD6</div>
        <button class="copy-btn" onclick="copyAddress()">复制地址</button>
        <p style="font-size: 12px; margin-top: 15px;">支付完成后点击“我已支付”</p>
        <button class="btn" style="background: var(--green);" onclick="checkStatus()">我已支付</button>
    </div>
</div>

<script>
    // ✅ 你的收款地址
    const MY_ADDRESS = "TSzeymMiwsphqH28LyYD32xBMoihioBKD6";
    const AMOUNT_USDT = 1000000; // 1 USDT (最小单位是6位小数)

    function showQR() {
        document.getElementById('payBtn').style.display = 'none';
        document.getElementById('qrBox').style.display = 'block';
        
        // 生成 QR 码图片 (使用开源 API)
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=tron:${MY_ADDRESS}?amount=${AMOUNT_USDT}`;
        document.getElementById('qrImg').src = qrUrl;
    }

    function copyAddress() {
        navigator.clipboard.writeText(MY_ADDRESS);
        alert("地址已复制！请在你的钱包中粘贴并发送 1 USDT。");
    }

    function checkStatus() {
        // 这里可以做一个简单的跳转，比如跳转到你的 VIP 页面
        window.location.href = "https://ganx838-commits.github.io/reward-page/success.html"; 
        // 注意：你需要创建一个 success.html 文件放在同一个仓库里
    }
</script>

</body>
</html>
